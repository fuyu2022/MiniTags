<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoRA 数据集标注编辑器</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="top">
    <div class="title">LoRA 数据集标注编辑器</div>
    <div class="controls">
      <input id="projectName" placeholder="项目名，例如 character_a" />
      <textarea id="initialTags" placeholder="当前分类标签，用逗号分隔"></textarea>
      <button id="saveProjectTagsBtn">保存项目标签</button>
      <button id="createProjectBtn">创建项目</button>
      <select id="projectSelect"><option value="">选择项目</option></select>
      <input id="datasetDir" placeholder="数据集目录，可留空，点击加载后选择" />
      <button id="loadDatasetBtn">加载数据集</button>
    </div>
  </header>

  <section class="tag-palette-wrap">
    <div class="tag-palette-head">
      <div>
        <div class="bar-title">可添加标签 tags.txt</div>
        <div class="tag-format-tip">格式：[面部]:smile, blue eyes　[服装]:school uniform, skirt</div>
      </div>
      <div id="categoryNav" class="category-nav"></div>
    </div>
    <div id="tagPalette" class="tag-palette"></div>
  </section>

  <main class="main">
    <section class="viewer">
      <div class="image-toolbar">
        <button id="prevBtn">上一张</button>
        <div id="counter">未加载</div>
        <button id="nextBtn">下一张</button>
      </div>
      <div class="image-box"><img id="imageView" alt="dataset image" /></div>
      <div class="label-panel">
        <div class="label-head">
          <div><strong id="imageName">无图片</strong><span id="saveState"></span></div>
          <button id="saveBtn">Save</button>
        </div>
        <div id="labelDropZone" class="label-drop-zone"><span class="placeholder">把上方 tag 拖到这里，或手动输入后按 Enter</span></div>
        <div class="manual-add">
          <input id="manualTag" placeholder="手动添加 tag，按 Enter" />
          <button id="addManualBtn">添加</button>
        </div>
      </div>
    </section>
    <aside class="side">
      <div class="bar-title">图片列表</div>
      <div id="imageList" class="image-list"></div>
    </aside>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
